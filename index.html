<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>토찌 달력</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap">
<style>
:root{
  --bg:#1f1f1f; --panel:#131314; --line:#3c4043; --text:#e3e3e3; --muted:#9aa0a6;
  --accent:#a8c7fa; --today:#0b57d0; --hover:#2a2b2e; --chip:#28292c;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Pretendard Variable",Pretendard,"Segoe UI","Malgun Gothic",sans-serif;font-size:14px}
input,select{font:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.app{display:grid;grid-template-columns:260px 1fr;grid-template-rows:64px 1fr;height:100vh}
header{grid-column:1/3;display:flex;white-space:nowrap;min-width:0;align-items:center;gap:12px;padding:0 16px}
.logo{display:flex;align-items:center;gap:10px;font-size:26px;width:244px;font-family:"Gaegu","Pretendard Variable",Pretendard,sans-serif;font-weight:700}
.logo b{background:#1a73e8;color:#fff;border-radius:6px;padding:2px 6px;font-size:16px}
.pill{border:1px solid var(--line);border-radius:20px;padding:8px 22px}
.pill:hover,.icon:hover{background:var(--hover)}
.icon{width:36px;height:36px;border-radius:50%;font-size:18px}
.title{font-size:22px;margin-left:8px}
.spacer{flex:1}
#search{background:var(--chip);border:1px solid var(--line);color:var(--text);border-radius:20px;padding:8px 14px;width:220px}
aside{padding:8px 16px;overflow:auto}
.create{background:#37393b;border-radius:16px;padding:16px 22px;font-size:15px;margin-bottom:20px}
.create:hover{background:#45474a}
.mini-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.mini{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;gap:2px}
.mini span{height:28px;line-height:28px;border-radius:50%;cursor:pointer}
.mini span:hover{background:var(--hover)}
.mini .dim{color:#6f7378}
.mini .t{background:var(--today);color:#fff}
.mini .sel{background:#004a77;color:#d3e3fd}
h4{margin:22px 0 8px;font-size:15px}
.cal-item{display:flex;align-items:center;gap:10px;padding:5px 0;cursor:pointer;user-select:none}
.box{width:18px;height:18px;border-radius:3px;border:2px solid;display:grid;place-items:center;font-size:12px;color:#1f1f1f}
main{background:var(--panel);border-radius:24px 24px 0 0;margin-right:12px;display:flex;flex-direction:column;overflow:hidden}
.dow{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;color:var(--muted);padding-top:8px}
.weeks{flex:1;display:grid;min-height:0}
.week{position:relative;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:22px;row-gap:3px;align-content:start;min-height:0;overflow:hidden}
.week .bgcell{grid-row:1/span 10;margin-bottom:-400px;border-left:1px solid var(--line)}
.week .bgcell:first-child{border-left:0}
.week .bgcell:hover{background:#ffffff08}
.dnum{grid-row:1;text-align:center;font-size:12px;padding-top:4px;z-index:1;pointer-events:none}
.dnum em{font-style:normal;display:inline-block;min-width:24px;height:24px;line-height:24px;border-radius:12px;padding:0 5px;pointer-events:auto;cursor:pointer}
.dnum em:hover{background:var(--hover)}
.dnum.other{color:#6f7378}
.dnum.today em{background:var(--accent);color:#062e6f;font-weight:bold}
.ev{z-index:2;margin:0 4px;padding:0 8px;font-size:12.5px;line-height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:4px;cursor:pointer}
.ev.bar{color:#e8eaed}
.ev.dot{display:flex;align-items:center;gap:6px}
.ev.dot:hover{background:var(--hover)}
.ev.dot i{flex:none;width:8px;height:8px;border-radius:50%}
.more{z-index:2;margin:0 4px;padding:0 8px;font-size:12px;line-height:22px;cursor:pointer;border-radius:4px}
.more:hover{background:var(--hover)}
.modal-bg{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:10}
.modal-bg.on{display:flex}
.modal{background:#2d2e31;border-radius:16px;padding:20px 24px;width:420px;max-width:calc(100vw - 32px);box-shadow:0 8px 30px #000a}
.modal h3{margin:0 0 14px}
.modal label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.modal input,.modal select{width:100%;background:#1f1f1f;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:8px}
.row{display:flex;gap:8px}
.row>*{flex:1}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.btn{padding:8px 18px;border-radius:18px}
.btn.primary{background:var(--accent);color:#062e6f}
.btn.danger{color:#f28b82;margin-right:auto}
.list .ev{margin:4px 0}
#view{background:var(--bg);padding:8px 14px}
#view option{background:#2d2e31}
.tview{flex:1;display:none;flex-direction:column;min-height:0}
.tgrid{display:grid;grid-template-columns:56px repeat(var(--n),minmax(0,1fr))}
.t-head{text-align:center;padding:8px 0 4px;font-size:11px;color:var(--muted)}
.t-head em{display:block;font-style:normal;font-size:24px;color:var(--text);width:44px;height:44px;line-height:44px;border-radius:50%;margin:2px auto 0;cursor:pointer}
.t-head em:hover{background:var(--hover)}
.t-head.today{color:var(--accent)}
.t-head.today em{background:var(--accent);color:#062e6f}
.t-allday{grid-auto-rows:22px;row-gap:3px;padding:3px 0;border-bottom:1px solid var(--line);min-height:28px}
.t-allday .lbl{grid-row:1;grid-column:1;font-size:10px;color:var(--muted);text-align:right;padding-right:8px;line-height:22px}
.t-body{flex:1;overflow:auto;position:relative}
.t-body .tgrid{height:calc(24 * var(--h))}
.hours{position:relative}
.hours span{position:absolute;right:8px;font-size:10px;color:var(--muted);transform:translateY(-50%)}
.tcol{position:relative;border-left:1px solid var(--line);background:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px var(--h))}
.tev{position:absolute;border-radius:4px;padding:2px 6px;font-size:12px;color:#fff;overflow:hidden;cursor:pointer;border:1px solid var(--panel);line-height:1.3}
.tev b{display:block;font-weight:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now{position:absolute;left:0;right:0;height:2px;background:#ea4335;z-index:3}
.now::before{content:"";position:absolute;left:-6px;top:-5px;width:12px;height:12px;border-radius:50%;background:#ea4335}
#bunny{position:fixed;left:0;top:0;width:70px;height:73px;pointer-events:none;z-index:50;will-change:transform;filter:drop-shadow(0 4px 3px #0006)}
#bunny .run{position:absolute;inset:0;background:url(img/hop.png) 0 0/280px 73px no-repeat}
#bunny .sleep{position:absolute;left:12px;bottom:2px;width:46px;height:29px;transform-origin:50% 100%;display:none}
#bunny .love{position:absolute;left:-55px;bottom:0;width:180px;height:172px;transform-origin:50% 100%;display:none}
#bunny .love img{width:100%;height:100%}
/* text sits on the blank cloth of img/banner.png (measured: left 3.7%, top 4%, 94.7% x 21.6%) */
#bunny .love b{position:absolute;left:3.7%;top:4%;width:94.7%;height:21.6%;display:flex;align-items:center;justify-content:center;
  font:700 19px "Gaegu","Pretendard Variable",sans-serif;color:#b23a48;letter-spacing:.5px;white-space:nowrap;transform:rotate(-1deg)}
#bunny.zz .run,#bunny.luv .run{display:none}
#bunny.zz .sleep,#bunny.luv .love{display:block}
@media (prefers-reduced-motion:reduce){#bunny{display:none}}
/* sound icons from the oddity project (MIT); same toggle style: class "off" + dimmer */
#soundBtn{display:grid;place-items:center}
#soundBtn::before{content:"";width:22px;height:22px;background:url(img/ui/icon-sound-on.svg) center/contain no-repeat}
#soundBtn.off::before{background-image:url(img/ui/icon-sound-off.svg)}
#soundBtn.off{opacity:.8}
/* while the song plays: hearts drift up around the banner bunny, the speaker button pulses */
body.playing #soundBtn::before{animation:beat .9s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
#bunny .note{position:absolute;bottom:60px;font-size:30px;color:#ff6b8a;opacity:0;pointer-events:none;text-shadow:0 1px 2px #0008}
body.playing #bunny.luv .note{animation:drift 2.4s ease-out infinite}
#bunny .note:nth-of-type(1){left:-45px}
#bunny .note:nth-of-type(2){left:85px;animation-delay:.6s!important;color:#f4a7b9}
#bunny .note:nth-of-type(3){left:-20px;animation-delay:1.2s!important;color:#e8505b}
#bunny .note:nth-of-type(4){left:70px;animation-delay:1.8s!important}
@keyframes drift{0%{opacity:0;transform:translate(0,0) rotate(-10deg) scale(.6)}
  15%{opacity:1}50%{transform:translate(10px,-40px) rotate(10deg) scale(1)}
  100%{opacity:0;transform:translate(-6px,-90px) rotate(-8deg) scale(1.1)}}
#songBox{position:fixed;right:16px;bottom:16px;width:240px;aspect-ratio:16/9;z-index:40;border-radius:10px;overflow:hidden;box-shadow:0 6px 20px #000a;display:none}
#songBox.on{display:block}
#songBox iframe{width:100%;height:100%;border:0}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  aside,.logo span,#search{display:none}
  .logo{width:auto}
  main{margin:0 4px}
  .ev{font-size:11px;padding:0 3px;margin:0 1px}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo"><b id="logoDay">20</b><span>토찌 달력</span></div>
    <button class="pill" id="todayBtn">오늘</button>
    <button class="icon" id="prev">‹</button>
    <button class="icon" id="next">›</button>
    <div class="title" id="title"></div>
    <div class="spacer"></div>
    <span id="gStatus" style="color:var(--muted);font-size:12px"></span>
    <button class="icon" id="soundBtn" title="소리 켜기/끄기"></button>
    <button class="pill" id="gBtn">구글 연결</button>
    <input id="search" placeholder="일정 검색">
    <select id="view" class="pill"><option value="month">월</option><option value="week">주</option><option value="day">일</option></select>
  </header>
  <aside>
    <button class="create" id="createBtn">＋ 만들기</button>
    <div class="mini-head"><b id="miniTitle"></b><span><button class="icon" id="mPrev">‹</button><button class="icon" id="mNext">›</button></span></div>
    <div class="mini" id="mini"></div>
    <h4>내 캘린더</h4><div id="myCals"></div>
    <h4 id="gHead" hidden>구글 캘린더</h4><div id="gCals"></div>
    <h4 id="otherHead">다른 캘린더</h4><div id="otherCals"></div>
  </aside>
  <main>
    <div class="dow"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
    <div class="weeks" id="weeks"></div>
    <div class="tview" id="tview"></div>
  </main>
</div>

<div id="bunny" aria-hidden="true"><div class="run"></div><img class="sleep" src="img/sleep.png" alt=""><div class="love"><img src="img/banner.png" alt=""><b>결혼 26주년 축하</b></div><span class="note">♥</span><span class="note">♥</span><span class="note">♥</span><span class="note">♥</span></div>

<div id="songBox"><div id="songPlayer"></div></div>

<div class="modal-bg" id="modalBg">
  <div class="modal" id="modal"></div>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
// ---------- data ----------
const CALS = [
  {id:'me',    name:'내 일정', color:'#7986cb', group:'my'},
  {id:'family',name:'가족',    color:'#8e7cc3', group:'my'},
  {id:'stock', name:'주식',    color:'#33b679', group:'my'},
  {id:'krhol', name:'대한민국의 휴일', color:'#c0392b', group:'other', readonly:true},
  {id:'ushol', name:'미국의 휴일',     color:'#4285f4', group:'other', readonly:true},
];
const KR = {'2026-01-01':'신정','2026-02-16':'설날 연휴','2026-02-17':'설날','2026-02-18':'설날 연휴','2026-03-01':'삼일절','2026-03-02':'대체 공휴일','2026-05-05':'어린이날','2026-05-24':'부처님오신날','2026-05-25':'대체 공휴일','2026-06-03':'지방선거일','2026-06-06':'현충일','2026-08-15':'광복절','2026-08-17':'대체 공휴일','2026-09-24':'추석 연휴','2026-09-25':'추석','2026-09-26':'추석 연휴','2026-10-03':'개천절','2026-10-05':'대체 공휴일','2026-10-09':'한글날','2026-12-25':'크리스마스'};
const US = {'2026-01-01':"New Year's Day",'2026-01-19':'Martin Luther King Jr. Day','2026-02-16':"Presidents' Day",'2026-05-25':'Memorial Day','2026-06-19':'Juneteenth','2026-07-03':'Independence Day (observed)','2026-07-04':'Independence Day','2026-09-07':'Labor Day','2026-10-12':'Columbus Day','2026-10-31':'Halloween','2026-11-11':'Veterans Day','2026-11-26':'Thanksgiving Day','2026-12-25':'Christmas Day'};

const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
};
let events = store.get('cal.events', null) || [
];
let hidden = new Set(store.get('cal.hidden', []));
const save = () => { store.set('cal.events', events); store.set('cal.hidden', [...hidden]); };

// ---------- date helpers ----------
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const today = new Date(); today.setHours(0,0,0,0);
let cur = new Date(today);   // anchor date; month view shows its month
let mini = new Date(today.getFullYear(), today.getMonth(), 1);
let view = store.get('cal.view', 'month');
let query = '';

function allEvents(){
  const list = [...events, ...gEvents].map(e=>({...e}));
  // built-in holidays only until Google is connected (Google has its own holiday calendars)
  if (!gToken) for (const [d,t] of Object.entries(KR)) list.push({id:'kr'+d,cal:'krhol',title:t,start:d,end:d,allDay:true});
  if (!gToken) for (const [d,t] of Object.entries(US)) list.push({id:'us'+d,cal:'ushol',title:t,start:d,end:d,allDay:true});
  return list.filter(e=>!hidden.has(e.cal) && (!query || e.title.toLowerCase().includes(query)));
}
const calOf = id => CALS.find(c=>c.id===id) || CALS[0];
const isBar = e => e.allDay || e.start !== e.end;

// ---------- month view ----------
const LANE_PX = 25;   // 22px row + 3px gap (see .week)
function render(){
  document.getElementById('logoDay').textContent = today.getDate();
  document.getElementById('view').value = view;
  const isMonth = view === 'month';
  document.querySelector('.dow').style.display = isMonth ? '' : 'none';
  document.getElementById('weeks').style.display = isMonth ? '' : 'none';
  document.getElementById('tview').style.display = isMonth ? 'none' : 'flex';
  gSync().catch(gErr);
  if (!isMonth) { renderTime(); renderSide(); return; }
  const ms = new Date(cur.getFullYear(), cur.getMonth(), 1);
  document.getElementById('title').textContent = `${ms.getFullYear()}년 ${ms.getMonth()+1}월`;
  const first = addDays(ms, -ms.getDay());
  const weeksN = Math.ceil((ms.getDay() + new Date(ms.getFullYear(),ms.getMonth()+1,0).getDate())/7);
  const box = document.getElementById('weeks');
  box.style.gridTemplateRows = `repeat(${weeksN},minmax(0,1fr))`;
  box.innerHTML = '';
  const evs = allEvents();
  // as many event lanes as fit under the day number, keeping one line for "N개 더보기"
  const MAX_LANES = Math.max(1, Math.floor(box.clientHeight / weeksN / LANE_PX) - 2);

  for (let w=0; w<weeksN; w++){
    const ws = addDays(first, w*7), we = addDays(ws, 6);
    const row = document.createElement('div'); row.className='week';
    for (let i=0;i<7;i++){
      const d = addDays(ws,i);
      const bg = document.createElement('div'); bg.className='bgcell'; bg.style.gridColumn=i+1;
      bg.onclick = () => openEditor({start:ymd(d), end:ymd(d)});
      row.appendChild(bg);
      const n = document.createElement('div');
      n.className = 'dnum' + (d.getMonth()!==cur.getMonth()?' other':'') + (+d===+today?' today':'');
      n.style.gridColumn = i+1;
      const label = d.getDate()===1 ? `${d.getMonth()+1}월 1일` : d.getDate();
      n.innerHTML = `<em>${label}</em>`;
      n.firstChild.onclick = () => showDay(d);
      row.appendChild(n);
    }
    // events touching this week
    const items = evs.filter(e => parse(e.start) <= we && parse(e.end) >= ws).map(e=>{
      const s = Math.max(0, Math.round((parse(e.start)-ws)/864e5));
      const en = Math.min(6, Math.round((parse(e.end)-ws)/864e5));
      return {e, s, en};
    });
    items.sort((a,b)=> (isBar(b.e)-isBar(a.e)) || (b.en-b.s)-(a.en-a.s) || a.s-b.s || (a.e.time||'').localeCompare(b.e.time||''));
    const lanes = []; const overflow = Array(7).fill(0);
    for (const it of items){
      let lane = 0;
      while (true){
        lanes[lane] ??= Array(7).fill(false);
        let free = true; for (let c=it.s;c<=it.en;c++) if (lanes[lane][c]) free=false;
        if (free) break; lane++;
      }
      for (let c=it.s;c<=it.en;c++) lanes[lane][c]=true;
      if (lane >= MAX_LANES){ for (let c=it.s;c<=it.en;c++) overflow[c]++; continue; }
      row.appendChild(evEl(it.e, it.s, it.en, lane+2));
    }
    overflow.forEach((n,c)=>{
      if (!n) return;
      const m = document.createElement('div'); m.className='more';
      m.style.gridColumn = c+1; m.style.gridRow = MAX_LANES+2;
      m.textContent = `${n}개 더보기`;
      m.onclick = () => showDay(addDays(ws,c));
      row.appendChild(m);
    });
    box.appendChild(row);
  }
  renderSide();
}

// ---------- week / day view ----------
const HOUR_PX = 48, DOW = '일월화수목금토';
const toMin = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };
function renderTime(){
  const n = view === 'week' ? 7 : 1;
  const start = view === 'week' ? addDays(cur, -cur.getDay()) : cur;
  const days = Array.from({length:n}, (_,i) => addDays(start, i));
  const last = days[n-1];
  document.getElementById('title').textContent = view === 'day'
    ? `${cur.getFullYear()}년 ${cur.getMonth()+1}월 ${cur.getDate()}일 (${DOW[cur.getDay()]})`
    : start.getMonth() === last.getMonth() ? `${start.getFullYear()}년 ${start.getMonth()+1}월`
    : `${start.getFullYear()}년 ${start.getMonth()+1}월 → ${last.getMonth()+1}월`;

  const tv = document.getElementById('tview');
  tv.style.setProperty('--n', n); tv.style.setProperty('--h', HOUR_PX+'px');
  tv.innerHTML = '';
  const evs = allEvents();

  // day headers
  const head = document.createElement('div'); head.className = 'tgrid';
  head.appendChild(document.createElement('div'));
  for (const d of days){
    const h = document.createElement('div'); h.className = 't-head' + (+d===+today ? ' today' : '');
    h.innerHTML = `${DOW[d.getDay()]}<em>${d.getDate()}</em>`;
    h.querySelector('em').onclick = () => { cur = d; view = 'day'; render(); };
    head.appendChild(h);
  }
  tv.appendChild(head);

  // all-day / multi-day row
  const ad = document.createElement('div'); ad.className = 'tgrid t-allday';
  ad.innerHTML = '<div class="lbl">종일</div>';
  const bars = evs.filter(e => isBar(e) && parse(e.start) <= last && parse(e.end) >= start).map(e => ({
    e, s: Math.max(0, Math.round((parse(e.start)-start)/864e5)), en: Math.min(n-1, Math.round((parse(e.end)-start)/864e5))
  })).sort((a,b) => (b.en-b.s)-(a.en-a.s) || a.s-b.s);
  const lanes = [];
  for (const it of bars){
    let lane = 0;
    while ((lanes[lane] ??= Array(n).fill(false)).slice(it.s, it.en+1).some(Boolean)) lane++;
    lanes[lane].fill(true, it.s, it.en+1);
    const el = evEl(it.e, it.s, it.en, lane+1);
    el.style.gridColumn = `${it.s+2} / ${it.en+3}`;
    ad.appendChild(el);
  }
  tv.appendChild(ad);

  // hourly grid
  const body = document.createElement('div'); body.className = 't-body';
  const grid = document.createElement('div'); grid.className = 'tgrid';
  const hours = document.createElement('div'); hours.className = 'hours';
  for (let h=1; h<24; h++) hours.innerHTML += `<span style="top:${h*HOUR_PX}px">${h<12?'오전':'오후'} ${h%12||12}시</span>`;
  grid.appendChild(hours);
  for (const d of days){
    const key = ymd(d), col = document.createElement('div'); col.className = 'tcol';
    col.onclick = ev => {
      const hh = Math.min(23, Math.floor(ev.offsetY / HOUR_PX));
      openEditor({start:key, end:key, time:`${pad(hh)}:00`});
    };
    // timed events: 1 hour long, overlapping ones share the column width
    const list = evs.filter(e => !isBar(e) && e.start === key && e.time).sort((a,b) => a.time.localeCompare(b.time));
    const ends = [], placed = [];
    for (const e of list){
      const s = toMin(e.time);
      let k = ends.findIndex(x => x <= s); if (k < 0) k = ends.length;
      ends[k] = s + 60; placed.push({e, s, k});
    }
    for (const p of placed){
      const c = calOf(p.e.cal), el = document.createElement('div');
      el.className = 'tev'; el.style.background = c.color;
      el.style.top = (p.s/60*HOUR_PX) + 'px'; el.style.height = (HOUR_PX-2) + 'px';
      el.style.left = (p.k/ends.length*100) + '%'; el.style.width = `calc(${100/ends.length}% - 4px)`;
      el.innerHTML = '<b></b><span></span>';
      el.firstChild.textContent = p.e.title; el.lastChild.textContent = p.e.time;
      el.onclick = ev => { ev.stopPropagation(); if (!c.readonly) openEditor(p.e); };
      col.appendChild(el);
    }
    if (+d === +today){
      const now = new Date(), line = document.createElement('div'); line.className = 'now';
      line.style.top = ((now.getHours()*60 + now.getMinutes())/60*HOUR_PX) + 'px';
      col.appendChild(line);
    }
    grid.appendChild(col);
  }
  body.appendChild(grid); tv.appendChild(body);
  body.scrollTop = 7.5 * HOUR_PX;
}

function evEl(e, s, en, gridRow){
  const c = calOf(e.cal), el = document.createElement('div');

// ---------- Google Calendar ----------
// OAuth client ID is public; put it here or paste it once in the UI (kept in localStorage).
const GOOGLE_CLIENT_ID = '167572818449-3qrvdk1k5g3p6t3eu3e1m1vivp8q5abq.apps.googleusercontent.com';
const GSCOPE = 'https://www.googleapis.com/auth/calendar.events https://www.googleapis.com/auth/calendar.calendarlist.readonly';
const API = 'https://www.googleapis.com/calendar/v3';
const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
let gToken = null, gClient = null, gEvents = [], gWindow = '';
const isG = calId => calId.startsWith('g:');
const gPath = (calId, evId) => `/calendars/${encodeURIComponent(calId.slice(2))}/events` + (evId ? '/' + encodeURIComponent(evId) : '');
const setStatus = s => document.getElementById('gStatus').textContent = s;

function gAuth(){
  return new Promise((res, rej) => {
    const id = GOOGLE_CLIENT_ID || store.get('cal.gclient', '');
    if (!window.google?.accounts) return rej(new Error('구글 로그인 스크립트를 불러오지 못했습니다'));
    gClient ??= google.accounts.oauth2.initTokenClient({client_id:id, scope:GSCOPE, callback:()=>{}});
    gClient.callback = r => {
      if (r.error) return rej(new Error(r.error));
      gToken = r.access_token;
      // keep the 1-hour token across reloads (F5); it expires on its own
      store.set('cal.gtoken', {t:gToken, exp:Date.now() + (r.expires_in - 60) * 1000});
      store.set('cal.gon', true);
      res();
    };
    gClient.error_callback = e => rej(new Error(e.type));
    gClient.requestAccessToken({prompt:''});
  });
}
async function gFetch(path, opt = {}, retry = true){
  const r = await fetch(API + path, {...opt, headers:{Authorization:'Bearer ' + gToken, 'Content-Type':'application/json'}});
  if (r.status === 401 && retry){ await gAuth(); return gFetch(path, opt, false); }   // token lasts 1 hour
  if (!r.ok) throw new Error(`Google API ${r.status}`);
  return r.status === 204 ? null : r.json();
}

let gConnecting = false;
async function gConnect(){
  if (gToken && CALS.some(c => c.group === 'google')) return gSync(true).catch(gErr);
  if (gConnecting) return;
  if (!GOOGLE_CLIENT_ID && !store.get('cal.gclient', '')){
    const id = prompt('구글 OAuth 클라이언트 ID를 붙여 넣으세요 (….apps.googleusercontent.com)');
    if (!id) return;
    store.set('cal.gclient', id.trim());
  }
  gConnecting = true;
  try {
    setStatus('구글 연결 중…');
    if (!gToken) await gAuth();
    const list = await gFetch('/users/me/calendarList');
    const gc = list.items.map(c => ({id:'g:'+c.id, name:c.summaryOverride || c.summary, color:c.backgroundColor, group:'google',
      readonly: !['owner','writer'].includes(c.accessRole)}));
    CALS.splice(0, CALS.length, ...CALS.filter(c => c.group !== 'google'), ...gc);
    document.getElementById('gBtn').textContent = '↻ 동기화';
    await gSync(true);
  } catch (err) { gErr(err); }
  finally { gConnecting = false; }
}
const gErr = err => setStatus('구글 오류: ' + err.message);

// reconnect after a reload: reuse a saved token that is still valid; if it ran out,
// fetch a new one on the first click (browsers only allow the sign-in popup from a click)
function gResume(){
  if (!store.get('cal.gon', false)) return;
  const saved = store.get('cal.gtoken', null);
  if (saved && saved.exp > Date.now()){ gToken = saved.t; gConnect(); return; }
  setStatus('클릭하면 구글 다시 연결');
  addEventListener('pointerdown', () => gConnect(), {once:true, capture:true});
}

// fetch the shown month ±1 month from every Google calendar
async function gSync(force){
  if (!gToken) return;
  const key = `${cur.getFullYear()}-${cur.getMonth()}`;
  if (!force && key === gWindow) return;
  gWindow = key;
  const from = new Date(cur.getFullYear(), cur.getMonth()-1, 1), to = new Date(cur.getFullYear(), cur.getMonth()+2, 1);
  const q = `?singleEvents=true&maxResults=2500&timeMin=${encodeURIComponent(from.toISOString())}&timeMax=${encodeURIComponent(to.toISOString())}`;
  setStatus('불러오는 중…');
  const lists = await Promise.all(CALS.filter(c => c.group === 'google').map(c =>
    gFetch(gPath(c.id) + q).then(r => (r.items || []).filter(it => it.status !== 'cancelled').map(it => fromG(it, c.id)))));
  if (key !== gWindow) return;   // user moved on while loading
  gEvents = lists.flat();
  setStatus(`구글 ${gEvents.length}건`);
  render();
}

function fromG(it, cal){
  const e = {id:'g'+it.id, gid:it.id, cal, title:it.summary || '(제목 없음)'};
  if (it.start.date){   // all-day: Google's end date is exclusive
    e.allDay = true; e.start = it.start.date; e.end = ymd(addDays(parse(it.end.date), -1));
  } else {
    const s = new Date(it.start.dateTime), en = new Date(it.end.dateTime);
    e.start = ymd(s); e.time = `${pad(s.getHours())}:${pad(s.getMinutes())}`;
    e.end = ymd(new Date(Math.max(+s, en - 1))); e.dur = (en - s) / 6e4;
  }
  return e;
}
function toG(r){
  if (!r.time) return {summary:r.title, start:{date:r.start}, end:{date:ymd(addDays(parse(r.end), 1))}};
  const [h, m] = r.time.split(':').map(Number);
  const s = parse(r.start); s.setHours(h, m);
  const en = parse(r.end); en.setHours(h, m + (r.start === r.end ? (r.dur || 60) : 60));
  return {summary:r.title, start:{dateTime:s.toISOString(), timeZone:tz}, end:{dateTime:en.toISOString(), timeZone:tz}};
}

// save to wherever rec.cal lives; moving between local and Google = create there + delete here
async function saveEvent(old, rec){
  if (isG(rec.cal)){
    const body = JSON.stringify(toG({...rec, dur:old.dur}));
    const same = old.gid && old.cal === rec.cal;
    const it = await gFetch(gPath(rec.cal, same ? old.gid : ''), {method: same ? 'PATCH' : 'POST', body});
    if (old.id && !same) await removeEvent(old);
    gEvents = gEvents.filter(x => x.id !== old.id).concat(fromG(it, rec.cal));
  } else {
    if (old.gid){ await removeEvent(old); rec.id = Date.now(); }
    events = old.id && !old.gid ? events.map(x => x.id === old.id ? rec : x) : [...events, rec];
    save();
  }
}
async function removeEvent(e){
  if (e.gid){ await gFetch(gPath(e.cal, e.gid), {method:'DELETE'}); gEvents = gEvents.filter(x => x.id !== e.id); }
  else { events = events.filter(x => x.id !== e.id); save(); }
}

// ---------- music box ----------
// A short music-box tune made with Web Audio (no audio file). It opens like the
// trumpet triplets of Mendelssohn's Wedding March (public domain), then lands on C major.
const musicBox = (() => {
  let ctx = null, on = store.get('cal.sound', true), lastPlay = 0;
  const btn = document.getElementById('soundBtn');
  const show = () => { btn.classList.toggle('off', !on); btn.setAttribute('aria-label', on ? '소리 끄기' : '소리 켜기'); btn.title = on ? '소리 끄기' : '소리 켜기'; };
  btn.onclick = () => { on = !on; store.set('cal.sound', on); show(); if (on) play(true); else pause(); };
  show();
  // browsers only allow sound after the first click/tap on the page
  addEventListener('pointerdown', () => { ctx ??= new AudioContext(); ctx.resume(); }, {capture:true});
  const freq = n => 440 * 2 ** ((n - 69) / 12);   // MIDI note -> Hz
  function note(midi, t, len){
    // music-box tone: bright attack, fast fade, plus a quiet octave partial
    for (const [mul, vol] of [[1, .22], [2, .07], [3, .03]]){
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = freq(midi) * mul;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(vol, t + .005);
      g.gain.exponentialRampToValueAtTime(.0001, t + len);
      o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + len + .05);
    }
  }
  // [midi note(s), beat length]; one beat = 0.42s
  const TUNE = [
    [67,1/3],[67,1/3],[67,1/3],[[72,76],1.5],
    [67,1/3],[67,1/3],[67,1/3],[[72,76],1.5],
    [67,1/3],[67,1/3],[67,1/3],[[76,79],.5],[[74,77],.5],[[72,76],.5],[[71,74],.5],
    [[72,76,79,84],2.5],
  ];
  // the song: official upload by the rights holder (Mountain Apple Company), embedded, never copied
  const SONG = 'V1bFr2SWP1I';   // "Somewhere over the Rainbow" - Israel Kamakawiwo'ole
  const box = document.getElementById('songBox');
  let yt = null, ytReady = false;
  window.onYouTubeIframeAPIReady = () => {
    yt = new YT.Player('songPlayer', {videoId:SONG, playerVars:{playsinline:1, rel:0},
      events:{onReady:() => { ytReady = true; },
              onStateChange:e => {
                document.body.classList.toggle('playing', e.data === YT.PlayerState.PLAYING);
                if (e.data === YT.PlayerState.ENDED) box.classList.remove('on');
              },
              onError:() => { ytReady = false; box.classList.remove('on'); }}});
  };
  const tag = document.createElement('script'); tag.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(tag);
  function pause(){ if (ytReady) yt.pauseVideo(); box.classList.remove('on'); }

  function play(force){
    if (!on) return;
    if (ytReady){ box.classList.add('on'); yt.playVideo(); return; }
    if (!ctx || ctx.state !== 'running') return;
    if (!force && performance.now() - lastPlay < 20000) return;   // not again for 20s
    lastPlay = performance.now();
    document.body.classList.add('playing');
    setTimeout(() => document.body.classList.remove('playing'), 5000);
    let t = ctx.currentTime + .05;
    for (const [n, beats] of TUNE){
      const len = beats * .42;
      for (const m of [].concat(n)) note(m, t, Math.max(len, .6) + .8);
      t += len;
    }
  }
  return {play, pause};
})();

// ---------- bunny that hops after the mouse ----------
(() => {
  const el = document.getElementById('bunny'), run = el.querySelector('.run'), sleep = el.querySelector('.sleep');
  const W = 70, H = 73, PAD = 3, FRAMES = 4, LOVE_AFTER = 1500, SLEEP_AFTER = Infinity;   // dozing is on hold; set e.g. 5500 to bring it back
  const love = el.querySelector('.love');
  let mx = innerWidth / 2, my = innerHeight / 2, x = mx, y = my, dir = 1, phase = 0, stillSince = performance.now();
  addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
  // events are obstacles: refresh their boxes a few times a second
  let walls = [];
  const scan = () => { walls = [...document.querySelectorAll('.ev,.tev,.more')]
    .map(el => el.getBoundingClientRect()).filter(r => r.width && r.height); };
  setInterval(scan, 300); scan();
  // push the bunny's box (x = centre, y = feet) out of any event it overlaps, along the shortest way
  const avoid = () => {
    for (const r of walls){
      const l = x - W/2, rt = x + W/2, t = y - H, b = y;
      if (rt < r.left - PAD || l > r.right + PAD || b < r.top - PAD || t > r.bottom + PAD) continue;
      const out = [r.left - PAD - rt, r.right + PAD - l, r.top - PAD - b, r.bottom + PAD - t];
      const k = out.reduce((best, v, i) => Math.abs(v) < Math.abs(out[best]) ? i : best, 0);
      if (k < 2) x += out[k]; else y += out[k];
    }
  };
  (function tick(now){
    now ??= performance.now();
    // aim a little behind and below the cursor so it never covers what you click
    const tx = mx - 52 * dir, ty = my + 6;
    const dx = tx - x, dy = ty - y, dist = Math.hypot(dx, dy);
    const ox = x, oy = y;
    if (dist > 4){
      const step = Math.min(dist, 0.1 + dist * 0.00175);   // leisurely; a bit faster when far behind
      x += dx / dist * step; y += dy / dist * step;
      if (Math.abs(mx - x) > 40) dir = mx > x ? 1 : -1;
    }
    avoid();
    // "moving" = it actually got somewhere, so a bunny stuck against an event can still nod off
    const moving = Math.hypot(x - ox, y - oy) > 0.15;
    if (moving){ stillSince = now; phase += 0.06; }
    else if (phase % (2 * Math.PI) > 0.2) phase += 0.06;   // finish the hop in progress, then land
    // when it stops: first holds up a heart ("I love you"), then dozes off
    const idle = now - stillSince, asleep = idle > SLEEP_AFTER, loving = idle > LOVE_AFTER && !asleep;
    el.classList.toggle('zz', asleep);
    if (loving && !el.classList.contains('luv')) musicBox.play();   // banner goes up
    if (moving && el.classList.contains('luv')) musicBox.pause();   // off running again
    el.classList.toggle('luv', loving);
    let lift = 0, tilt = 0;
    if (loving){
      // waves the banner: rocks side to side and bobs on each swing
      const w = Math.sin(now / 260);
      love.style.transform = `translateY(${-Math.abs(w) * 4}px) rotate(${w * 7}deg)`;
    } else if (asleep){
      // slow breathing and a little nod
      const t = now / 1000;
      sleep.style.transform = `scale(${1 + Math.sin(t * 2) * 0.015}, ${1 + Math.sin(t * 2) * 0.03}) rotate(${Math.sin(t * 0.7) * 2}deg)`;
    } else {
      // 4 frames per hop (crouch, push, air, land); body sways side to side for the waddle
      const p = phase % (2 * Math.PI);
      run.style.backgroundPositionX = -Math.floor(p / (2 * Math.PI) * FRAMES) * 70 + "px";
      lift = Math.sin(p / 2) * 10;
      tilt = Math.sin(phase / 2) * 6;
    }
    el.style.transform = `translate(${x - W/2}px, ${y - H - lift}px) scaleX(${loving ? 1 : dir}) rotate(${tilt}deg)`;   // never mirror the banner text
    requestAnimationFrame(tick);
  })();
})();
</script>
</body>
</html>
